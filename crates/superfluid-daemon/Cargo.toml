[package]
name = "superfluid"
default-run = "superfluid"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The superfluid daemon: durable session store (WAL, verbatim token spans, epochs), generation runtime over Link W, and the native session API"

[lib]
name = "superfluid_daemon"

[features]
default = ["basert"]
basert = ["dep:superfluid-engine-ffi", "dep:superfluid-adapter-basert", "tui"]
llamacpp = ["dep:superfluid-adapter-llamacpp"]
mlx = ["dep:superfluid-adapter-mlx"]
tui = ["dep:ratatui"]

[dependencies]
superfluid-abi.workspace = true
superfluid-engine.workspace = true
superfluid-fingerprint.workspace = true
superfluid-proto.workspace = true
superfluid-shm.workspace = true
superfluid-worker.workspace = true
superfluid-agent.workspace = true
superfluid-linkf.workspace = true
superfluid-engine-ffi = { path = "../superfluid-engine-ffi", version = "0.1.1", optional = true }
superfluid-adapter-kit = { workspace = true }
superfluid-adapter-mock = { workspace = true }
superfluid-adapter-basert = { workspace = true, optional = true }
superfluid-adapter-llamacpp = { workspace = true, optional = true }
superfluid-adapter-mlx = { workspace = true, optional = true }
superfluid-tokenizer-hf = { workspace = true }
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
minijinja = { version = "2", features = ["loader", "json", "preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
http-body = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "registry", "std"] }
ureq = { version = "3", default-features = false }
sha2 = "0.10"
base64 = "0.22"
xxhash-rust.workspace = true
ratatui = { version = "0.29", optional = true }
mdns-sd = { version = "0.21", default-features = false }

[dev-dependencies]
tungstenite = "0.29"

superfluid-executor = { workspace = true }

[[bin]]
name = "superfluid"

[[bin]]
name = "superfluid-workerd"

[[bin]]
name = "superfluid-noded"

# Its own main(): the binary is also the server and the worker it tests.
[[test]]
name = "embedded_serve"
harness = false

[lints]
workspace = true

