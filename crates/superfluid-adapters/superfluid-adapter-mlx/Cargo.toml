[package]
name = "superfluid-adapter-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MLX as a superfluid runtime: RuntimePrimitives over mlx-lm through an embedded CPython, for the generic executor, and the runtime's worker executable"

[dependencies]
superfluid-abi = { workspace = true }
superfluid-adapter-kit = { workspace = true }
superfluid-engine = { workspace = true }
superfluid-executor = { workspace = true }
xxhash-rust = { workspace = true }
superfluid-tokenizer-hf = { workspace = true }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
serde_json = "1"
thiserror = { workspace = true }

[[bin]]
name = "superfluid-worker-mlx"
path = "src/bin/superfluid-worker-mlx.rs"

[build-dependencies]
pyo3-build-config = "0.29"

[dev-dependencies]
superfluid = { path = "../../superfluid-daemon" }
serde_json = "1"

[lints]
workspace = true
