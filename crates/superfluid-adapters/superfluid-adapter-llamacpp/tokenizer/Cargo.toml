[package]
name = "superfluid-tokenizer-llamacpp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The llama.cpp runtime's tokenizer library: GGUF tokenization through the vocabulary-only load of the llama.cpp beside it, loaded by the daemon at run time"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
superfluid-adapter-kit = { workspace = true }
superfluid-adapter-llamacpp = { path = "..", version = "0.2.3" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
