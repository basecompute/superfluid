name: Pages

# A push to main publishes the site as "dev", and a tag v* as its major.minor
# and "latest", to the gh-pages branch that https://superfluid.sh serves,
# with scripts/install.sh at the root. Each version is a static export of
# docs-site/ built under its own directory. Run it by hand with "latest"
# ticked to publish this ref's docs as /latest/ between releases.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docs/**", "docs-site/**", "scripts/install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      latest:
        description: Also publish this ref as /latest/
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages ../pages origin/gh-pages
      - name: Build the versions
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            dirs=("${v%.*}" latest)
          else
            dirs=(dev)
            [[ "${LATEST:-false}" == true ]] && dirs+=(latest)
          fi
          for d in "${dirs[@]}"; do
            (cd docs-site && NEXT_PUBLIC_BASE_PATH="/$d" npm run build)
            rm -rf "../pages/$d"
            cp -R docs-site/out "../pages/$d"
          done
      - name: Root files
        run: |
          set -euo pipefail
          cd ../pages
          cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
          echo superfluid.sh > CNAME
          touch .nojekyll
          home=dev
          [[ -d latest ]] && home=latest
          printf '<!doctype html><meta charset="utf-8"><title>superfluid</title><link rel="canonical" href="%s/"><meta http-equiv="refresh" content="0; url=%s/"><script>location.replace("%s/"+location.hash)</script>\n' "$home" "$home" "$home" > index.html
          cp "$home/404.html" 404.html
          git add -A
          git diff --cached --quiet || git commit -m "Publish docs: ${GITHUB_REF_NAME}"
          git push origin gh-pages
