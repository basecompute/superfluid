[workspace]
resolver = "2"
members = [
    "third_party/baseRT/baseRT-sys",
    "crates/superfluid-abi",
    "crates/superfluid-fingerprint",
    "crates/superfluid-proto",
    "crates/superfluid-engine",
    "crates/superfluid-engine-ffi",
    "crates/superfluid-shm",
    "crates/superfluid-worker",
    "crates/superfluid-agent",
    "crates/superfluid-linkf",
    "crates/superfluid-executor",
    "crates/superfluid-tokenizer-hf",
    "crates/superfluid-daemon",
    "crates/superfluid-adapters/superfluid-adapter-kit",
    "crates/superfluid-adapters/superfluid-adapter-mock",
    "crates/superfluid-adapters/superfluid-adapter-basert",
    "crates/superfluid-adapters/superfluid-adapter-llamacpp",
    "crates/superfluid-adapters/superfluid-adapter-llamacpp/tokenizer",
    "crates/superfluid-adapters/superfluid-adapter-mlx",
]

default-members = [
    "crates/superfluid-abi",
    "crates/superfluid-fingerprint",
    "crates/superfluid-proto",
    "crates/superfluid-engine",
    "crates/superfluid-engine-ffi",
    "crates/superfluid-shm",
    "crates/superfluid-worker",
    "crates/superfluid-agent",
    "crates/superfluid-linkf",
    "crates/superfluid-executor",
    "crates/superfluid-tokenizer-hf",
    "crates/superfluid-daemon",
    "crates/superfluid-adapters/superfluid-adapter-kit",
    "crates/superfluid-adapters/superfluid-adapter-mock",
    "crates/superfluid-adapters/superfluid-adapter-basert",
    "crates/superfluid-adapters/superfluid-adapter-llamacpp",
    "crates/superfluid-adapters/superfluid-adapter-llamacpp/tokenizer",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/basecompute/superfluid"
homepage = "https://github.com/basecompute/superfluid"
keywords = ["llm", "inference", "serving", "llama-cpp", "mlx"]
categories = ["command-line-utilities", "science"]

[workspace.dependencies]
baseRT-sys = { path = "third_party/baseRT/baseRT-sys", version = "0.3.0", features = ["no-link"] }
superfluid-abi = { path = "crates/superfluid-abi", version = "0.1.2" }
superfluid-fingerprint = { path = "crates/superfluid-fingerprint", version = "0.1.2" }
superfluid-proto = { path = "crates/superfluid-proto", version = "0.1.2" }
superfluid-engine = { path = "crates/superfluid-engine", version = "0.1.2" }
superfluid-agent = { path = "crates/superfluid-agent", version = "0.1.2" }
superfluid-shm = { path = "crates/superfluid-shm", version = "0.1.2" }
superfluid-linkf = { path = "crates/superfluid-linkf", version = "0.1.2" }
superfluid-executor = { path = "crates/superfluid-executor", version = "0.1.2" }
superfluid-adapter-kit = { path = "crates/superfluid-adapters/superfluid-adapter-kit", version = "0.1.2" }
superfluid-adapter-mock = { path = "crates/superfluid-adapters/superfluid-adapter-mock", version = "0.1.2" }
superfluid-adapter-basert = { path = "crates/superfluid-adapters/superfluid-adapter-basert", version = "0.1.2" }
superfluid-adapter-llamacpp = { path = "crates/superfluid-adapters/superfluid-adapter-llamacpp", version = "0.1.2" }
superfluid-adapter-mlx = { path = "crates/superfluid-adapters/superfluid-adapter-mlx", version = "0.1.2" }
superfluid-tokenizer-hf = { path = "crates/superfluid-tokenizer-hf", version = "0.1.2" }
superfluid-worker = { path = "crates/superfluid-worker", version = "0.1.2" }
superfluid = { path = "crates/superfluid-daemon", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
